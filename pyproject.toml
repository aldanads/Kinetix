[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinetix"
version = "0.1.0"
description = "Kinetic Monte Carlo simulator for materials deposition, annealing, and memristive device modeling"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Dr. Samuel Aldana Delgado", email = "samuel.delgado@tyndall.ie" },
]
dependencies = [
    "numpy>=1.24,<2",
    "scipy",
    "pandas",
    "pyyaml",
    "mpi4py",
    "pymatgen",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "fenics-dolfinx",
    "gmsh",
    "petsc4py",
]

[project.optional-dependencies]
mace = [
    # Note: torch is installed via pip and auto-selects CUDA on Linux.
    # numpy MUST stay <2 for pymatgen compatibility.
    "ase",
    "mace-torch",
    "torch",
    # Model fetch from the Hugging Face Hub (calculator.model repo IDs).
    "huggingface_hub",
]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[project.scripts]
kinetix = "kinetix.cli:main"

# ---------------------------------------------------------------------------
# Hatchling build configuration
#
# Flat layout: the importable package stays at kinetix/ in the repository
# root. The top-level data/parameters directory (simulation presets + defect/
# reaction/electrical/grain-boundary parameter files) is listed as an
# artifact so it ships in the wheel at the same relative path it occupies in
# the repository. This keeps get_parameters_root()'s fallback resolution
# correct for both a source checkout and an installed package.
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["kinetix"]
force-include = { "data/parameters" = "data/parameters" }

[tool.hatch.build.targets.sdist]
include = ["data/parameters/**"]

# ---------------------------------------------------------------------------
# Pytest configuration
#
# Category markers let agents run fast feedback by default:
#   pytest tests/ -q -m "not solver and not mace"   # ~30 s - few minutes
# Tests marked `slow` are ADDITIONALLY skipped unless --runslow is passed
# (see tests/conftest.py) — they run real MACE CI-NEB sweeps for hours.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "solver: Poisson/heat/FEM solver tests (very slow, ~20min total)",
    "mace: MACE-related tests (very slow without GPU)",
]